<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm | ShopAdmin</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">

    <aside class="sidebar" id="sidebar-container">
    </aside>

    <main class="main-content">
        <header>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Tìm tên sản phẩm, mã SKU...">
            </div>
            <div class="user-actions">
                <a href="create.html" class="btn-add" style="text-decoration: none; display: inline-block;"><i class="fas fa-plus"></i> Thêm sản phẩm</a>
            </div>
        </header>

        <div id="summary-container"></div>

        <section class="table-container">
            <div class="table-header">
                <h3>Danh mục sản phẩm</h3>
                <div class="filters">
                    <select id="categoryFilter">
                        <option value="all">Tất cả danh mục</option>
                    </select>
                </div>
            </div>

            <div id="table-container"></div>
        </section>
    </main>
</div>


<script type="module" src="../js/product.js"></script>

</body>
</html>
