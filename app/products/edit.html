<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm sản phẩm mới | ShopAdmin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Giữ nguyên toàn bộ CSS siêu đẹp của bạn ở đây */
        :root { --primary-color: #3498db; --dark-color: #2c3e50; --bg-color: #f4f7f6; --success: #27ae60; --border: #dcdde1; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--dark-color); }
        .container { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--dark-color); color: white; padding: 25px; position: sticky; top: 0; height: 100vh; }
        .sidebar h2 { margin-bottom: 40px; text-align: center; color: var(--primary-color); }
        .sidebar ul { list-style: none; }
        .sidebar ul li { padding: 15px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; color: #ecf0f1; }
        .sidebar ul li.active { background: #34495e; color: var(--primary-color); }
        .main-content { flex: 1; padding: 40px; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-back { text-decoration: none; color: #7f8c8d; font-weight: 500; }
        .product-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h3 { margin-bottom: 20px; font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--primary-color); }
        .image-upload { border: 2px dashed var(--border); border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: 0.3s; }
        .image-upload:hover { border-color: var(--primary-color); background: #f0f7ff; }
        .image-upload i { font-size: 2rem; color: #bdc3c7; margin-bottom: 10px; }
        .preview-img { width: 100%; margin-top: 15px; border-radius: 8px; display: none; }
        .form-footer { margin-top: 20px; display: flex; justify-content: flex-end; gap: 15px; padding: 20px; background: white; border-radius: 12px; }
        .btn { padding: 12px 25px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
        .btn-save { background: var(--success); color: white; }
        .btn-cancel { background: #eee; color: #7f8c8d; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <aside class="sidebar" id="sidebar-container"></aside>

    <main class="main-content">
        <div class="header-actions">
            <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Quay lại danh sách</a>
            <h2>Chỉnh sửa sản phẩm</h2>
        </div>

        <form id="productForm">
            <div class="product-grid">
                <div class="left-col">
                    <div class="card">
                        <h3>Thông tin chung</h3>
                        <div class="form-group">
                            <label>Tên sản phẩm *</label>
                            <input type="text" id="name" placeholder="Ví dụ: iPhone 15 Pro Max" required>
                        </div>
                        <div class="form-group">
                            <label>Mô tả sản phẩm</label>
                            <textarea id="description" rows="5" placeholder="Nhập đặc điểm nổi bật..."></textarea>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Giá cả & Kho hàng</h3>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div class="form-group">
                                <label>Giá bán (VNĐ) *</label>
                                <input type="number" id="price" placeholder="0" required>
                            </div>
                            <div class="form-group">
                                <label>Mã SKU</label>
                                <input type="text" id="sku" placeholder="VD: IP15-BLU">
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr; gap: 20px;">
                            <div class="form-group">
                                <label>Số lượng tồn kho *</label>
                                <input type="number" id="remaining" placeholder="0" required>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="right-col">
                    <div class="card">
                        <h3>Hình ảnh sản phẩm</h3>
                        <div class="form-group">
                            <label>Link ảnh (URL)</label>
                            <input type="text" id="imageUrl" placeholder="https://link-anh-cua-ban.jpg" oninput="previewImage(this.value)">
                        </div>
                        <div class="image-upload" style="padding: 10px;">
                            <img id="imgPreview" class="preview-img" src="https://via.placeholder.com/150?text=No+Image" style="display: block;" alt="Preview">
                        </div>
                    </div>

                    <div class="card">
                        <h3>Phân loại</h3>
                        <div class="form-group">
                            <label>Danh mục</label>
                            <select id="categoryId"></select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-footer">
                <a href="index.html" class="btn btn-cancel">Hủy bỏ</a>
                <button type="submit" class="btn btn-save">Lưu sản phẩm</button>
            </div>
        </form>
    </main>
</div>

<script type="module" src="../js/edit-product.js"></script>

<script>
    function previewImage(url) {
        const output = document.getElementById('imgPreview');
        if (url) {
            output.src = url;
        } else {
            output.src = 'https://via.placeholder.com/150?text=No+Image';
        }
    }
</script>

</body>
</html>
